<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摩羯桌宠设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings-card">
      <header class="hero">
        <div class="eyebrow">MOJIE // DESKTOP UNIT</div>
        <h1>摩羯桌宠设置</h1>
        <p>她会记住窗口位置，也会记住你刚才惹了她几次。</p>
      </header>

      <section class="settings-list" aria-label="桌宠设置">
        <label class="setting-row switch-row">
          <span>
            <strong>始终置顶</strong>
            <small>让摩羯留在普通窗口上方</small>
          </span>
          <input id="always-on-top" type="checkbox" />
        </label>

        <label class="setting-row switch-row">
          <span>
            <strong>开机启动</strong>
            <small>开发模式下是否生效由系统启动项权限决定</small>
          </span>
          <input id="open-at-login" type="checkbox" />
        </label>

        <label class="setting-row switch-row">
          <span>
            <strong>显示托盘图标</strong>
            <small>关闭后请使用角色右键菜单返回</small>
          </span>
          <input id="show-tray" type="checkbox" />
        </label>

        <div class="setting-row slider-row">
          <div class="setting-heading">
            <span>
              <strong>缩放</strong>
              <small>保持等比，不拉伸角色</small>
            </span>
            <output id="scale-value" for="scale">100%</output>
          </div>
          <input
            id="scale"
            type="range"
            min="0.5"
            max="2"
            step="0.05"
            aria-label="桌宠缩放"
          />
          <div class="range-ends"><span>50%</span><span>200%</span></div>
        </div>

        <div class="setting-row slider-row">
          <div class="setting-heading">
            <span>
              <strong>音量</strong>
              <small>仅控制轻量界面提示音，不含角色语音</small>
            </span>
            <output id="volume-value" for="volume">35%</output>
          </div>
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.05"
            aria-label="提示音音量"
          />
          <div class="range-ends"><span>静音</span><span>最大</span></div>
        </div>
      </section>

      <div class="actions">
        <button id="reset-position" class="secondary" type="button">
          恢复默认位置
        </button>
        <button id="quit-app" class="danger" type="button">退出程序</button>
      </div>

      <footer>
        <span id="status" role="status" aria-live="polite">设置会自动保存</span>
        <span>v1.0 · 素材来自你的原始表情图</span>
      </footer>
    </main>

    <script type="module" src="./settings.js"></script>
  </body>
</html>
